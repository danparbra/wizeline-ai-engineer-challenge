name: CI-CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------------
      # 1. CHECK OUT CODE & SETUP ENVIRONMENT
      # ------------------------------------------------------
      - name: Check out code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false
          terraform_version: 1.5.2

      # ------------------------------------------------------
      # 2. TERRAFORM: INIT, VALIDATE, PLAN & APPLY INFRASTRUCTURE
      # ------------------------------------------------------
      - name: Terraform Init
        working-directory: ./tf
        run: terraform init

      - name: Terraform Validate
        working-directory: ./tf
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./tf
        run: terraform plan
        env:
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}

      - name: Terraform Apply
        working-directory: ./tf
        run: terraform apply --auto-approve
        env:
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}

      - name: Capture Terraform Outputs
        working-directory: ./tf
        run: |
          echo "api_url=$(terraform output -raw api_url)" >> $GITHUB_ENV
          echo "predictor_lambda_ecr_repo_url=$(terraform output -raw predictor_lambda_ecr_repo_url)" >> $GITHUB_ENV

      # ------------------------------------------------------
      # 3. BUILD & PUSH DOCKER IMAGES FOR LAMBDA FUNCTIONS
      # ------------------------------------------------------
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & Push lambda_rag
        working-directory: ./containers/lambda_predictor
        run: |
          ECR_REPO_URL="${{ env.predictor_lambda_ecr_repo_url }}"
          ECR_REPO_NAME=$(echo $ECR_REPO_URL | cut -d'/' -f2)
          IMAGE_TAG="latest"
          docker build --platform=linux/amd64 --provenance=false -t $ECR_REPO_NAME:$IMAGE_TAG .
          docker tag $ECR_REPO_NAME:$IMAGE_TAG ${{ steps.login-ecr.outputs.registry }}/${ECR_REPO_NAME}:$IMAGE_TAG
          docker push ${{ steps.login-ecr.outputs.registry }}/${ECR_REPO_NAME}:$IMAGE_TAG
          aws lambda update-function-code --function-name wl-predictor-lambda --image-uri ${{ steps.login-ecr.outputs.registry }}/${ECR_REPO_NAME}:$IMAGE_TAG